on:
  push:
    branches:
      - main
permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write
name: release-please
jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      - name: Release Please! 🤖
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
      - name: Checkout 🛎
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # Fetch all history and tags
      - name: Setup node env 🏗
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          check-latest: true
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
      - name: Install dependencies 👨🏻‍💻
        run: npm ci --prefer-offline --no-audit
      - name: Publish released packages on NPM 📦
        run: |
          set -euo pipefail
          for path in $(jq -r '.[]' <<< '${{ steps.release.outputs.paths_released }}'); do
            echo "publishing $path"
            (cd "$path" && npm publish)
          done
        if: ${{ steps.release.outputs.releases_created == 'true' }}
      - name: Build and publish package 🚀
        run: |
          npx pkg-pr-new publish --comment=update
        if: ${{ !steps.release.outputs.release_created }}
      - name: Login to ghcr 🔧
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get Pre-release tag 🏷️
        id: prerelease
        run: |
          TAG=$(node core/node/scripts/createPrereleaseTag.js)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Generated prerelease tag: $TAG"
        if: ${{ !steps.release.outputs.release_created }}
      # Build the core frontend SPA when root (".") is released or during general main-branch prereleases.
      # Skipped when release-please only released a workspace package (e.g. packages/mcp).
      - name: Build SPA ⚙️
        run: |
          # Check if root package (".") was released, or if this is a non-release main-branch push
          if jq -e 'contains(["."])' <<< '${{ steps.release.outputs.paths_released }}' > /dev/null 2>&1 || [ "${{ steps.release.outputs.releases_created }}" != "true" ]; then
            npm run build
          fi

      # Build and push the eodash SPA container image (ghcr.io/eodash/eodash).
      # 1. On official root release: tag with release tag (e.g., eodash-v5.9.0).
      # 2. On standard main push without release: tag with prerelease tag (e.g., eodash-v5.9.1-beta.0).
      # 3. If only a sub-package like packages/mcp was released: skip to avoid tag mismatch.
      - name: Build and push SPA image 🔧
        run: |
          if jq -e 'contains(["."])' <<< '${{ steps.release.outputs.paths_released }}' > /dev/null 2>&1; then
            echo "Building SPA image for release: ${{ steps.release.outputs.tag_name }}"
            docker build -t ghcr.io/eodash/eodash:${{ steps.release.outputs.tag_name }} .
            docker push ghcr.io/eodash/eodash:${{ steps.release.outputs.tag_name }}
          elif [ "${{ steps.release.outputs.releases_created }}" != "true" ]; then
            echo "Building SPA image for prerelease: ${{ steps.prerelease.outputs.tag }}"
            docker build -t ghcr.io/eodash/eodash:${{ steps.prerelease.outputs.tag }} .
            docker push ghcr.io/eodash/eodash:${{ steps.prerelease.outputs.tag }}
          else
            echo "Root SPA was not released in this run; skipping SPA container build."
          fi

      # Build and push the MCP Server container image.
      # Runs ONLY when release-please creates an official release for packages/mcp.
      # Tags pushed: specific version (e.g. ghcr.io/eodash/mcp:1.0.0) and :latest.
      # No dev/prerelease builds are pushed for the MCP server.
      - name: Build and push MCP Server image 🚀
        run: |
          set -euo pipefail
          # Check if packages/mcp is in the released paths array
          if jq -e 'contains(["packages/mcp"])' <<< '${{ steps.release.outputs.paths_released }}' > /dev/null 2>&1; then
            MCP_VERSION=$(jq -r .version packages/mcp/package.json)
            echo "Building and pushing MCP Server image for version: $MCP_VERSION"
            docker build -f packages/mcp/Dockerfile \
              -t ghcr.io/eodash/mcp:${MCP_VERSION} \
              -t ghcr.io/eodash/mcp:latest .
            docker push ghcr.io/eodash/mcp:${MCP_VERSION}
            docker push ghcr.io/eodash/mcp:latest
          else
            echo "packages/mcp was not released in this run; skipping MCP container build."
          fi
