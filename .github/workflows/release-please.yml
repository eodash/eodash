on:
  push:
    branches:
      - main
permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write
name: release-please
jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      - name: Release Please! 🤖
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
      - name: Checkout 🛎
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # Fetch all history and tags
      - name: Setup node env 🏗
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          check-latest: true
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
      - name: Install dependencies 👨🏻‍💻
        run: npm ci --prefer-offline --no-audit
      - name: Publish released packages on NPM 📦
        run: |
          set -euo pipefail
          for path in $(jq -r '.[]' <<< '${{ steps.release.outputs.paths_released }}'); do
            echo "publishing $path"
            (cd "$path" && npm publish)
          done
        if: ${{ steps.release.outputs.releases_created == 'true' }}
      - name: Build and publish package 🚀
        run: |
          npx pkg-pr-new publish --comment=update
        if: ${{ !steps.release.outputs.release_created }}
      - name: Login to ghcr 🔧
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get Pre-release tag 🏷️
        id: prerelease
        run: |
          TAG=$(node core/node/scripts/createPrereleaseTag.js)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Generated prerelease tag: $TAG"
        if: ${{ !steps.release.outputs.release_created }}
      - name: Build SPA ⚙️
        run: npm run build
      - name: Build image 🔧
        run: |
          if [ "${{ steps.release.outputs.release_created }}" == "true" ]; then
            docker build -t ghcr.io/eodash/eodash:${{ steps.release.outputs.tag_name }} .
          else
            docker build -t ghcr.io/eodash/eodash:${{ steps.prerelease.outputs.tag }} .
          fi
      - name: Push ghcr 🚀
        run: |
          if [ "${{ steps.release.outputs.release_created }}" == "true" ]; then
            docker push ghcr.io/eodash/eodash:${{ steps.release.outputs.tag_name }}
          else
            docker push ghcr.io/eodash/eodash:${{ steps.prerelease.outputs.tag }}
          fi
