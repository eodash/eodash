name: Run Tests
on:
  pull_request:
  workflow_dispatch:

jobs:
  scope:
    name: Detect which package changed ⚙️
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.changed.outputs.app }}
      packages: ${{ steps.changed.outputs.packages }}
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Work out which suites to run 🔍
        id: changed
        # Comma separated package directory names, e.g. "mcp,stac". A package
        # belongs here only when it reads the app's sources (core/, widgets/,
        # templates/) instead of importing the built package, so that a change
        # to the app runs its suite too. Leave empty when none do.
        env:
          RUN_ON_APP_CHANGE: ""
        run: node core/node/scripts/changedPackages.js ${{ github.event.pull_request.base.sha }}

  app:
    name: ${{ matrix.project }} tests
    needs: scope
    if: needs.scope.outputs.app == 'true'
    runs-on: ubuntu-24.04
    # continue-on-error: ${{ !matrix.blocking }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: cli
            blocking: true
          - project: unit
            blocking: true
          - project: component
            blocking: true
          - project: template
            blocking: false
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup node env 🏗
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          check-latest: true
          cache: "npm"
      - name: Install dependencies 👨🏻‍💻
        run: npm ci --prefer-offline --no-audit
      # the cli project runs in node, so it needs no browser
      - name: Cache Playwright browser 🎭
        if: matrix.project != 'cli'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser 🎭
        if: matrix.project != 'cli' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Install Playwright system deps 🎭
        if: matrix.project != 'cli'
        run: npx playwright install-deps chromium
      - name: Run ${{ matrix.project }} tests 👀
        run: npm run test:${{ matrix.project }}

  # One job for every workspace package, so adding `packages/<name>` with a
  # matching `test:<name>` script is the whole registration.
  packages:
    name: ${{ matrix.package }} tests
    needs: scope
    if: needs.scope.outputs.packages != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.scope.outputs.packages) }}
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup node env 🏗
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          check-latest: true
          cache: "npm"
      - name: Install dependencies 👨🏻‍💻
        run: npm ci --prefer-offline --no-audit
      # the packages run in node, so no browser is needed here
      - name: Run ${{ matrix.package }} tests 👀
        run: npm run test:${{ matrix.package }}

  docker:
    name: Docker container test
    needs: scope
    if: needs.scope.outputs.app == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup node env 🏗
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          check-latest: true
          cache: "npm"
      - name: Install dependencies 👨🏻‍💻
        run: npm ci --prefer-offline --no-audit
      - name: Build Eodash app 📦
        run: npm run build
      - name: Build Docker image 🐳
        run: docker build -t eodash-container-test:latest .
      - name: Cache Playwright browser 🎭
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser 🎭
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Install Playwright system deps 🎭
        run: npx playwright install-deps chromium
      - name: Test Default / Zero-Env Container 🚀
        run: |
          docker run -d --name eodash-zero-env -p 8080:80 eodash-container-test:latest
          CONTAINER_TEST_URL=http://localhost:8080 npm run test:docker
      - name: Test Custom Runtime Config Container 🚀
        run: |
          docker run -d --name eodash-custom-env \
            -p 8081:80 \
            -e EODASH_RUNTIME_CONFIG=http://localhost:8081/config.js \
            -e STAC_ENDPOINT=https://example.com/stac \
            -e BRAND=eox \
            -e API=true \
            -e TEMPLATES=expert \
            eodash-container-test:latest
          CONTAINER_TEST_URL=http://localhost:8081 \
          EXPECTED_RUNTIME_CONFIG=http://localhost:8081/config.js \
          EXPECTED_TEMPLATES=expert \
          npm run test:docker
      - name: Dump container logs on failure 📜
        if: failure()
        run: |
          echo "=== eodash-zero-env logs ==="
          docker logs eodash-zero-env || true
          echo "=== eodash-custom-env logs ==="
          docker logs eodash-custom-env || true
      - name: Stop and cleanup containers 🧹
        if: always()
        run: |
          docker rm -f eodash-zero-env eodash-custom-env || true
