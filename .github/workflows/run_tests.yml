name: Run Tests
on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  scope:
    name: Detect which package changed ⚙️
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.changed.outputs.app }}
      packages: ${{ steps.changed.outputs.packages }}
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Work out which suites to run 🔍
        id: changed
        # Comma separated package directory names, e.g. "mcp,stac". A package
        # belongs here only when it reads the app's sources (core/, widgets/,
        # templates/) instead of importing the built package, so that a change
        # to the app runs its suite too. Leave empty when none do.
        env:
          RUN_ON_APP_CHANGE: ""
        run: node core/node/scripts/changedPackages.js ${{ github.event.pull_request.base.sha }}

  app:
    name: ${{ matrix.project }} tests
    needs: scope
    if: needs.scope.outputs.app == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    # continue-on-error: ${{ !matrix.blocking }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: cli
            blocking: true
          - project: unit
            blocking: true
          - project: component
            blocking: true
          - project: template
            blocking: false
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup node env 🏗
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          check-latest: true
          cache: "npm"
      - name: Install dependencies 👨🏻‍💻
        run: npm ci --prefer-offline --no-audit
      # the cli project runs in node, so it needs no browser
      - name: Cache Playwright browser 🎭
        if: matrix.project != 'cli'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser 🎭
        if: matrix.project != 'cli' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Install Playwright system deps 🎭
        if: matrix.project != 'cli'
        run: npx playwright install-deps chromium
      - name: Find main's performance report 🔍
        id: baseline
        if: matrix.project == 'template' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow=run_tests.yml --branch=refactor-performance-report \
            --status=success --limit=1 --json databaseId --jq '.[0].databaseId // empty')
          echo "comparing against run ${run:-none}"
          echo "run-id=$run" >> "$GITHUB_OUTPUT"
      - name: Fetch the performance report 📥
        if: matrix.project == 'template' && steps.baseline.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: performance-report
          path: tests/performance
          run-id: ${{ steps.baseline.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Run ${{ matrix.project }} tests 👀
        env:
          VITE_PERF: ${{ matrix.project == 'template' && '1' || '' }}
        run: npm run test:${{ matrix.project }}
      - name: Publish the performance report 📝
        if: matrix.project == 'template' && hashFiles('tests/performance/report.md') != ''
        run: cat tests/performance/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the performance report 📎
        if: matrix.project == 'template' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-report
          path: |
            tests/performance/report.md
            tests/performance/report.json

  # One job for every workspace package, so adding `packages/<name>` with a
  # matching `test:<name>` script is the whole registration.
  packages:
    name: ${{ matrix.package }} tests
    needs: scope
    if: needs.scope.outputs.packages != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.scope.outputs.packages) }}
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup node env 🏗
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          check-latest: true
          cache: "npm"
      - name: Install dependencies 👨🏻‍💻
        run: npm ci --prefer-offline --no-audit
      # the packages run in node, so no browser is needed here
      - name: Run ${{ matrix.package }} tests 👀
        run: npm run test:${{ matrix.package }}
