name: Run Tests
on:
  pull_request:
    branches:
      - "main"

  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.project }} tests
    runs-on: ubuntu-24.04
    # continue-on-error: ${{ !matrix.blocking }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: cli
            blocking: true
          - project: unit
            blocking: true
          - project: component
            blocking: true
          - project: template
            blocking: false
          - project: mcp
            blocking: true
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup node env 🏗
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          check-latest: true
          cache: "npm"
      - name: Install dependencies 👨🏻‍💻
        run: npm ci --prefer-offline --no-audit
      # the cli project runs in node, so it needs no browser
      - name: Cache Playwright browser 🎭
        if: matrix.project != 'cli' && matrix.project != 'mcp'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser 🎭
        if: matrix.project != 'cli' && steps.playwright-cache.outputs.cache-hit != 'true' && matrix.project != 'mcp'
        run: npx playwright install chromium
      - name: Install Playwright system deps 🎭
        if: matrix.project != 'cli' && matrix.project != 'mcp'
        run: npx playwright install-deps chromium
      - name: Run ${{ matrix.project }} tests 👀
        run: npm run test:${{ matrix.project }}
