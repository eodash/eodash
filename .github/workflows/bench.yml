name: Benchmarks

# A push to `main` records the baseline; a pull request compares against the
# newest `main` record in its job summary. Same-repo runs record themselves on
# the `bench-results` branch under `<branch>/<UTC timestamp>-<sha8>/`. The branch is
# data only; Pages serves `gh-pages`. A failing benchmark turns the check red,
# but it is not a required check, so it never blocks a merge.
on:
  push:
    branches:
      - "main"
  pull_request:

# A later push cancels a running one, so the baseline is the newest commit's.
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Benchmarks 📊
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup node env 🏗
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          check-latest: true
          cache: "npm"
      - name: Install dependencies 👨🏻‍💻
        run: npm ci --prefer-offline --no-audit
      - name: Cache Playwright browser 🎭
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser 🎭
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Install Playwright system deps 🎭
        run: npx playwright install-deps chromium

      # A missing branch (exit 2) is tolerated; it does not exist before the
      # first record. Anything else, such as an unreachable remote, fails.
      - name: Look for the benchmark history 🔍
        id: history
        run: |
          if git ls-remote --exit-code --heads origin bench-results >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            [ $? -eq 2 ]
          fi
      - name: Checkout the benchmark history 📚
        if: steps.history.outputs.exists == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: bench-results
          path: bench-history
      - name: Use main's latest results as the baseline 📥
        run: |
          if [ -d bench-history/main ]; then
            latest=$(ls -d bench-history/main/*/ | sort | tail -1)
            mkdir -p .bench-baseline
            cp "$latest"*.json .bench-baseline/
            echo "comparing against $latest"
          fi
      - name: Run benchmarks 📊
        id: bench
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: npm run bench
      - name: Publish the table 📝
        if: always() && hashFiles('bench-report.md') != ''
        run: cat bench-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Name this run 🏷
        id: run
        # env, not inline: a fork's branch name is untrusted input
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "dir=${BRANCH//\//-}/$(date -u +%Y%m%dT%H%M%SZ)-${SHA::8}" >> "$GITHUB_OUTPUT"
          mkdir bench-run
          cp .bench-results/*.json bench-report.md bench-run/
      # A fork's token is read-only, so its runs are reported but not recorded.
      - name: Record this run 📎
        if: github.event.pull_request.head.repo.fork != true
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4
        with:
          branch: bench-results
          folder: bench-run
          target-folder: ${{ steps.run.outputs.dir }}
          # the default force-push drops a record another run pushed meanwhile
          force: false
          commit-message: "bench: ${{ steps.run.outputs.dir }}"
      # The PR run is recorded first, then turned red; it is not a required check.
      - name: Fail on a failed benchmark ❌
        if: steps.bench.outcome == 'failure'
        run: exit 1
