name: Benchmarks

# A push to the baseline branch records the results every later run compares
# against; a dispatch run fetches those and reports the difference.
# TODO: point both at main once this branch merges.
on:
  push:
    branches:
      - "main"
  workflow_dispatch:

# A later push cancels a running one, so the baseline is the newest commit's.
concurrency:
  group: bench-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASELINE_BRANCH: refactor-performance-report
  ARTIFACT: bench-baseline

jobs:
  bench:
    name: Benchmarks 📊
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup node env 🏗
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          check-latest: true
          cache: "npm"
      - name: Install dependencies 👨🏻‍💻
        run: npm ci --prefer-offline --no-audit
      - name: Cache Playwright browser 🎭
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser 🎭
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Install Playwright system deps 🎭
        run: npx playwright install-deps chromium

      - name: Find the recorded results 🔍
        id: recorded
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow=bench.yml --branch="$BASELINE_BRANCH" \
            --event=push --status=success --limit=1 --json databaseId --jq '.[0].databaseId // empty')
          echo "comparing against run ${run:-none}"
          echo "run-id=$run" >> "$GITHUB_OUTPUT"
      - name: Fetch the recorded results 📥
        if: steps.recorded.outputs.run-id != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ env.ARTIFACT }}
          path: .bench-baseline
          run-id: ${{ steps.recorded.outputs.run-id }}
          github-token: ${{ github.token }}

      # Results present: every benchmark compares against them. Absent: every
      # benchmark reports as new. Either way the run leaves its own behind.
      - name: Run benchmarks 📊
        run: npm run bench
      - name: Publish the table 📝
        if: always() && hashFiles('bench-report.md') != ''
        run: cat bench-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Record the results 📎
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT }}
          path: .bench-results
          # Dotted, and the default skips those silently.
          include-hidden-files: true
          if-no-files-found: error
